AWSTemplateFormatVersion: '2010-09-09'
Description: 'BestOf2 Dual-Cloud Engine - 1-Click AWS IAM User, Least-Privilege Policy & S3 Deployment Bucket'

Parameters:
  UserName:
    Type: String
    Default: 'bestof2-deployer'
    Description: 'Name of the dedicated IAM User for BestOf2 deployments'

Resources:
  # 1. S3 Deployment Bucket (Globally unique name auto-generated by CloudFormation)
  BestOf2Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: CleanOldDeploymentZips
            Status: Enabled
            ExpirationInDays: 30

  # 2. Least-Privilege IAM Policy for Lambda Web Functions & Deployment Bucket
  BestOf2Policy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${UserName}-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaWebFunctionManagement
            Effect: Allow
            Action:
              - 'lambda:*'
            Resource: '*'
          - Sid: IAMRoleManagementForLambda
            Effect: Allow
            Action:
              - 'iam:CreateRole'
              - 'iam:GetRole'
              - 'iam:AttachRolePolicy'
              - 'iam:PassRole'
            Resource: '*'
          - Sid: DeploymentBucketAccess
            Effect: Allow
            Action:
              - 's3:*'
            Resource:
              - !GetAtt BestOf2Bucket.Arn
              - !Sub '${BestOf2Bucket.Arn}/*'

  # 3. Dedicated IAM User
  BestOf2User:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref UserName
      ManagedPolicyArns:
        - !Ref BestOf2Policy

  # 4. Generate Programmatic Access Key Pair
  BestOf2AccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref BestOf2User

Outputs:
  AWSACCESSKEYID:
    Description: 'Copy this to your .env or GitHub Actions Secrets'
    Value: !Ref BestOf2AccessKey

  AWSSECRETACCESSKEY:
    Description: 'Copy this to your .env or GitHub Actions Secrets'
    Value: !GetAtt BestOf2AccessKey.SecretAccessKey

  AWSDEPLOYMENTBUCKET:
    Description: 'Copy this to your .env or GitHub Actions Secrets'
    Value: !Ref BestOf2Bucket

  AWSDEFAULTREGION:
    Description: 'AWS Region for your deployment'
    Value: !Ref 'AWS::Region'
